<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kimny Jewelry Single Invoice Generator (A5 Portrait)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Khmer:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        :root {
            --bg-theme: #ffe7e5;
            --purple-theme: #e2bbf7;
            --dark-purple: #9168ad;
        }

        body {
            font-family: 'Noto Sans Khmer', sans-serif;
            background-color: var(--bg-theme);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* --- Unified Dashboard Navigation --- */
        .nav-group {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            width: 100%;
            max-width: 750px;
            margin-bottom: 20px;
        }

        .btn-nav {
            background-color: white;
            color: var(--dark-purple);
            border: 2px solid var(--dark-purple);
            padding: 10px 4px;
            font-size: 13px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .btn-nav:hover {
            background-color: var(--bg-theme);
        }

        .btn-nav.active {
            background-color: var(--dark-purple);
            color: white;
            border-style: solid;
        }

        /* --- Workspace Controls Panels --- */
        .admin-panel {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            max-width: 750px;
            width: 100%;
            margin-bottom: 40px;
            box-sizing: border-box;
        }

        .meta-input-group {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .input-block {
            flex: 1;
            min-width: 200px;
        }

        .label-badge {
            background-color: var(--purple-theme);
            padding: 6px 12px;
            border-radius: 8px;
            display: inline-block;
            font-weight: bold;
            margin-bottom: 6px;
        }

        input[type="text"], textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 15px;
            font-family: 'Noto Sans Khmer', sans-serif;
        }

        textarea {
            resize: vertical;
            height: 100px;
        }

        .file-controls {
            display: flex;
            gap: 10px;
            margin-top: 6px;
        }

        .btn-upload {
            flex: 1;
            background-color: #f3e8fc;
            border: 1px dashed var(--dark-purple);
            color: var(--dark-purple);
            padding: 10px;
            border-radius: 6px;
            text-align: center;
            font-weight: bold;
            cursor: pointer;
            display: inline-block;
        }

        .action-btns {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }

        .btn {
            flex: 1;
            background-color: var(--purple-theme);
            border: none;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn:hover {
            filter: brightness(0.95);
        }

        /* --- Preview Target Document Blueprint Frame (A5 Layout) --- */
        #invoice-container {
            width: 148mm;
            height: 210mm;
            position: relative;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            overflow: hidden;
            background-color: #fff;
        }

        #invoice-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: fill;
            z-index: 1;
        }

        #invoice-content-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }

        .printable-text {
            position: absolute;
            font-family: 'Noto Sans Khmer', sans-serif;
            color: #000000 !important;
            font-weight: bold;
            font-size: 15px;
        }

        /* Fixed Location Mapping Coordinates */
        #pos-invoice-num {
            bottom: 32.5mm;
            left: 31mm;
            width: 39mm;
            text-align: left;
            white-space: nowrap;
        }

        #pos-date {
            bottom: 32.5mm;
            left: 92mm;
            width: 52mm;
            text-align: center;
            white-space: nowrap;
        }

        /* Blue Description Box Area Map Boundaries */
        #pos-description-box {
            top: 82mm;
            left: 12mm;
            width: 70.5mm;
            height: 98mm;
            overflow: hidden;
            font-size: 17px;
            font-weight: normal;
            line-height: 1.6;
            word-wrap: break-word;
            white-space: pre-wrap;
        }

        /* --- Labor (ឈ្នួល) & Total Layout Mapping Coordinates --- */
        #pos-labor-box {
            top: 130mm;       /* Positioned right beneath the description field box */
            left: 35mm;         /* Adjusted line alignment value to your layout map */
            width: 48mm;
            text-align: left;
            white-space: nowrap;
        }

        #pos-total-box {
            top: 145mm;       /* Positioned perfectly beneath the labor box row */
            left: 35mm;
            width: 48mm;
            text-align: left;
            white-space: nowrap;
        }

        /* Red Image Container Frame Box Area Map Boundaries (4:3 Portrait) */
        #pos-image-frame {
            position: absolute;
            top: 73.5mm;
            left: 83.5mm;
            width: 55mm;
            height: 80mm;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #render-photo {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
            border: 3px solid #9168ad;
            border-radius: 12px;
            box-sizing: border-box;
        }

        /* --- Print Mode Rule Implementations --- */
        @media print {
            body {
                background: none;
                padding: 0;
                margin: 0;
            }
            .admin-panel {
                display: none !important;
            }
            #invoice-container {
                box-shadow: none;
                margin: 0;
                position: absolute;
                top: 0;
                left: 0;
                page-break-inside: avoid;
            }
            @page {
                size: A5 portrait;
                margin: 0;
            }
        }
    </style>
</head>
<body>

    <div class="admin-panel">
        <div class="nav-group">
            <a href="../index.html" class="btn-nav">Watermark</a>
            <a href="index.html" class="btn-nav">វិក័យប័ត្រឥវ៉ាន់បោះដុំ</a>
            <a href="#" class="btn-nav active">វិក័យប័ត្រឥវ៉ាន់តែ ១</a>
            <a href="#" class="btn-nav">គណនាតម្លៃ</a>
        </div>

        <div class="meta-input-group">
            <div class="input-block">
                <span class="label-badge">Date</span>
                <input type="text" id="input-date" placeholder="ថ្ងៃ">
            </div>
            <div class="input-block">
                <span class="label-badge">Invoice Number</span>
                <input type="text" id="input-id" placeholder="លេខ ឬ ឈ្មោះភ្ញៀវ">
            </div>
        </div>

        <div class="meta-input-group">
            <div class="input-block" style="min-width: 100%;">
                <span class="label-badge">Item Details / Description</span>
                <textarea id="input-description" placeholder="បញ្ចូលព័ត៌មានលម្អិតទំនិញនៅទីនេះ..."></textarea>
            </div>
        </div>

        <div class="meta-input-group">
            <div class="input-block">
                <span class="label-badge">ឈ្នួល (Labor Fee)</span>
                <input type="text" id="input-labor" placeholder="បញ្ជូលតម្លៃឈ្នួល...">
            </div>
            <div class="input-block">
                <span class="label-badge">Total</span>
                <input type="text" id="input-total" placeholder="បញ្ចូលតម្លៃសរុប...">
            </div>
        </div>

        <div class="meta-input-group">
            <div class="input-block">
                <div class="file-controls">
                    <label class="btn-upload" for="upload-photo">📁 Choose From Library</label>
                    <input type="file" id="upload-photo" accept="image/*" hidden>
                    
                    <label class="btn-upload" for="capture-camera" style="background-color: #e3f2fd; border-color: #2196f3; color: #1e88e5;">📷 Take Photo Directly</label>
                    <input type="file" id="capture-camera" accept="image/*" capture="environment" hidden>
                </div>
            </div>
        </div>

        <div class="action-btns">
            <button class="btn" onclick="downloadImage()">Download Photo</button>
            <button class="btn" onclick="window.print()">Print</button>
        </div>
    </div>

    <div id="invoice-container">
        <img id="invoice-bg" src="single-invoice.jpg" alt="Single Invoice Baseline Template">

        <div id="invoice-content-layer">
            <div id="pos-description-box" class="printable-text"></div>
            
            <div id="pos-image-frame">
                <img id="render-photo" src="#" alt="Render Target View Source">
            </div>

            <div id="pos-labor-box" class="printable-text"></div>
            <div id="pos-total-box" class="printable-text"></div>

            <div id="pos-invoice-num" class="printable-text"></div>
            <div id="pos-date" class="printable-text"></div>
        </div>
    </div>

    <script>
        const khmerDigits = ['០', '១', '២', '៣', '៤', '៥', '៦', '៧', '៨', '៩'];
        function toKhmerNumber(num) {
            return num.toString().split('').map(x => khmerDigits[parseInt(x)] || x).join('');
        }

        function getKhmerCurrentDate() {
            const months = [
                "មករា", "កុម្ភៈ", "មីនា", "មេសា", "ឧសភា", "មិថុនា", 
                "កក្កដា", "សីហា", "កញ្ញា", "តុលា", "វិច្ឆិកា", "ធ្នូ"
            ];
            const now = new Date();
            const day = toKhmerNumber(now.getDate());
            const month = months[now.getMonth()];
            const year = toKhmerNumber(now.getFullYear());
            
            return `ថ្ងៃទី ${day} ខែ${month} ឆ្នាំ ${year}`;
        }

        // Initialize Automatic Form Data Parameters
        document.getElementById('input-date').value = getKhmerCurrentDate();

        // Sync and Process Real-time Interface Pipeline Data Transformations
        function syncInvoiceData() {
            document.getElementById('pos-date').innerText = document.getElementById('input-date').value;
            document.getElementById('pos-invoice-num').innerText = document.getElementById('input-id').value;
            document.getElementById('pos-description-box').textContent = document.getElementById('input-description').value;
            
            // Sync text content inside the new preview display boxes
            document.getElementById('pos-labor-box').innerText = document.getElementById('input-labor').value;
            document.getElementById('pos-total-box').innerText = document.getElementById('input-total').value;
        }

        // Handle Image Stream Sources Safely
        function handleImageUpload(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const renderTarget = document.getElementById('render-photo');
                    renderTarget.src = e.target.result;
                    renderTarget.style.display = 'block';
                }
                reader.readAsDataURL(file);
            }
        }

        // Event Intercept Tracking Listeners 
        document.getElementById('input-date').addEventListener('input', syncInvoiceData);
        document.getElementById('input-id').addEventListener('input', syncInvoiceData);
        document.getElementById('input-description').addEventListener('input', syncInvoiceData);
        document.getElementById('input-labor').addEventListener('input', syncInvoiceData);
        document.getElementById('input-total').addEventListener('input', syncInvoiceData);
        document.getElementById('upload-photo').addEventListener('change', handleImageUpload);
        document.getElementById('capture-camera').addEventListener('change', handleImageUpload);

        // Initial Data Frame Sync Pass Execution
        syncInvoiceData();

        // Image Canvas Frame Export Render Functionality
        function downloadImage() {
            const target = document.getElementById('invoice-container');
            html2canvas(target, {
                scale: 3, 
                useCORS: true,
                logging: false
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = `SingleInvoice-${document.getElementById('input-id').value || 'Draft'}.jpg`;
                link.href = canvas.toDataURL('image/jpeg', 0.95);
                link.click();
            });
        }
    </script>
</body>
</html>
